```yaml
name: Download OSBoxes Image and Upload Artifact

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Create download directory
        run: mkdir -p downloads extracted

      - name: Download tar.gz file
        run: |
          wget -O downloads/sc-dt-2025.12.tar.gz \
            "https://drive.syntacore.com/s/8Atb2bcYjZS8eHE/download?path=/2025/2025.12&files=sc-dt-2025.12.tar.gz"

      - name: Verify downloaded file
        run: |
          ls -lh downloads/
          file downloads/sc-dt-2025.12.tar.gz

      - name: Extract tar.gz
        run: |
          tar -xzf downloads/sc-dt-2025.12.tar.gz -C extracted

      - name: Show extracted contents
        run: |
          echo "Extracted contents:"
          find extracted -maxdepth 2 -type d -print

      - name: Zip each subdirectory separately
        run: |
          mkdir -p zipped

          for dir in extracted/*/; do
            if [ -d "$dir" ]; then
              name=$(basename "$dir")
              echo "Creating ZIP for: $name"

              cd extracted
              zip -r "../zipped/${name}.zip" "$name"
              cd ..
            fi
          done

      - name: Verify ZIP files
        run: |
          echo "Created ZIP files:"
          ls -lh zipped/

      - name: Upload all ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: sc-dt-2025.12
          path: zipped/*.zip
          if-no-files-found: error
```
