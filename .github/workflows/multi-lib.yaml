name: RISC-V Newlib (multilib)

on:
  schedule:
    - cron: "0 3 1 * *"    # 03:00 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/share/boost /usr/local/graalvm \
                       /usr/local/share/chromium /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autotools-dev curl python3 python3-pip \
            libmpc-dev libmpfr-dev libgmp-dev libusb-1.0-0-dev \
            gawk build-essential bison flex texinfo gperf libtool \
            patchutils bc zlib1g-dev libexpat1-dev libncurses-dev \
            device-tree-compiler

      - name: Clone sources (shallow, parallel submodules)
        run: |
          git clone --depth 1 https://github.com/riscv-collab/riscv-gnu-toolchain src
          cd src
          git submodule update --init --recursive --depth 1 --jobs "$(nproc)"

      - name: Configure
        working-directory: src
        run: ./configure --prefix="$HOME/riscv"

      - name: Build
        working-directory: src
        run: make -j"$(nproc)"

      - name: Package
        run: tar -czf riscv-newlib-multilib.tar.gz -C "$HOME/riscv" .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: riscv-newlib-multilib-${{ github.run_number }}
          path: riscv-newlib-multilib.tar.gz
          retention-days: 40
          compression-level: 0
          if-no-files-found: error