name: Build RISC-V GNU Toolchain

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Toolchain to build"
        required: true
        default: "newlib"
        type: choice
        options:
          - newlib   # bare-metal (riscv64-unknown-elf-*)
          - linux    # Linux (riscv64-unknown-linux-gnu-*)
  # push:
  #   branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350        # build can take hours; hard cap is 360
    env:
      TARGET: ${{ inputs.target || 'newlib' }}
      PREFIX: ${{ github.workspace }}/install

    steps:
      - name: Free up disk space (the build needs ~20 GB)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/share/boost /usr/local/graalvm \
                       /usr/local/share/chromium /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autotools-dev curl python3 python3-pip \
            libmpc-dev libmpfr-dev libgmp-dev libusb-1.0-0-dev \
            gawk build-essential bison flex texinfo gperf libtool \
            patchutils bc zlib1g-dev libexpat1-dev libncurses-dev \
            device-tree-compiler

      - name: Clone toolchain sources
        uses: actions/checkout@v4
        with:
          repository: riscv-collab/riscv-gnu-toolchain
          # ref: 2024.04.12   # uncomment + set a release tag for reproducible builds
          path: src

      - name: Fetch submodules
        working-directory: src
        run: git submodule update --init --recursive

      - name: Configure
        working-directory: src
        run: ./configure --prefix="$PREFIX"
        # optional flags, e.g.:
        #   --with-arch=rv64gc --with-abi=lp64d   (single-config newlib)
        #   --enable-multilib                     (for the linux target)

      - name: Build
        working-directory: src
        run: make -j"$(nproc)" "$TARGET"    # drop to -j2 if the runner OOMs

      - name: Sanity check
        run: |
          if [ "$TARGET" = "linux" ]; then
            "$PREFIX/bin/riscv64-unknown-linux-gnu-gcc" --version
          else
            "$PREFIX/bin/riscv64-unknown-elf-gcc" --version
          fi
          du -sh "$PREFIX"

      - name: Package (tar preserves exec permissions, artifact zips don't)
        run: tar -czf "riscv-gnu-toolchain-${TARGET}.tar.gz" -C "$PREFIX" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: riscv-gnu-toolchain-${{ env.TARGET }}
          path: riscv-gnu-toolchain-*.tar.gz
          retention-days: 30
          compression-level: 0    # already gzipped; skip zip compression for speed
          if-no-files-found: error