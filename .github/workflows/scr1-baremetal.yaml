name: Build RISC-V Toolchain RV32IMC Baremetal Cross Compiler
on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Run the RISC-V Toolchain build'
        required: true
        default: 'yes'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Install Dependencies
        run: sudo apt-get install -y autoconf automake autotools-dev curl python3 python3-pip libmpc-dev libmpfr-dev libgmp-dev gawk build-essential bison flex texinfo gperf libtool patchutils bc zlib1g-dev libexpat-dev ninja-build git cmake libglib2.0-dev

      - name: Clone RISC-V GNU Toolchain (only needed submodules, via GitHub mirrors)
        run: |
          git clone --depth 1 https://github.com/riscv/riscv-gnu-toolchain
          cd riscv-gnu-toolchain

          git config submodule.binutils.url https://github.com/bminor/binutils-gdb.git
          git config submodule.newlib.url https://github.com/bminor/newlib.git

          for i in 1 2 3; do
            git submodule update --init --depth 1 binutils gcc newlib && break
            echo "Retry $i failed, waiting 20s..."
            sleep 20
          done

      - name: Build RV32IMC RISC-V Toolchain
        run: |
          cd riscv-gnu-toolchain
          ./configure --prefix=/opt/riscv --with-arch=rv32imc_zicsr_zifencei --with-abi=ilp32
          make -j $(nproc)

      - name: List installed binaries
        run: ls -la /opt/riscv/bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rv32imc-baremetal-elf-toolchain
          path: /opt/riscv
