name: Build SCR1 RISC-V Bare-Metal Toolchain

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            autotools-dev \
            curl \
            python3 \
            python3-pip \
            python3-tomli \
            libmpc-dev \
            libmpfr-dev \
            libgmp-dev \
            gawk \
            build-essential \
            bison \
            flex \
            texinfo \
            gperf \
            libtool \
            patchutils \
            bc \
            zlib1g-dev \
            libexpat-dev \
            ninja-build \
            git \
            cmake \
            libglib2.0-dev \
            libslirp-dev \
            libncurses-dev

      - name: Clone RISC-V GNU Toolchain
        run: |
          git clone --recursive https://github.com/riscv/riscv-gnu-toolchain.git
          cd riscv-gnu-toolchain

      - name: Configure for SCR1
        run: |
          cd riscv-gnu-toolchain

          ./configure \
            --prefix=$GITHUB_WORKSPACE/riscv \
            --with-arch=rv32imc \
            --with-abi=ilp32 \
            --disable-linux

      - name: Build Bare-Metal Toolchain
        run: |
          cd riscv-gnu-toolchain
          make newlib -j2

      - name: Verify
        run: |
          ./riscv/bin/riscv64-unknown-elf-gcc --version
          ./riscv/bin/riscv64-unknown-elf-gcc \
            -march=rv32imc \
            -mabi=ilp32 \
            -dM -E - < /dev/null | grep -E 'RISCV|__riscv'

      - name: Upload Toolchain
        uses: actions/upload-artifact@v4
        with:
          name: scr1-riscv32-baremetal-toolchain
          path: riscv/