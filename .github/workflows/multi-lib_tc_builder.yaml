name: Build RISC-V Toolchain Generic multilib
on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Run the RISC-V Toolchain build'
        required: true
        default: 'yes'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # riscv-gnu-toolchain (multilib, non-shallow submodules) is disk-hungry;
          # ubuntu-latest only ships ~14GB free by default. Reclaim unused preinstalled
          # toolchains before we start.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autotools-dev curl python3 python3-pip \
            libmpc-dev libmpfr-dev libgmp-dev gawk build-essential bison flex texinfo gperf \
            libtool patchutils bc zlib1g-dev libexpat-dev ninja-build git cmake libglib2.0-dev

      - name: Configure git mirrors + resilience settings
        run: |
          # sourceware.org (upstream host for binutils-gdb / newlib-cygwin submodules)
          # rate-limits anonymous HTTPS clones (HTTP 429). Redirect to GitHub's official
          # read-only mirrors, which don't have this problem. Must be set BEFORE the
          # --recursive clone so submodule URLs resolve through the mirror too.
          git config --global url."https://github.com/bminor/binutils-gdb.git".insteadOf "https://sourceware.org/git/binutils-gdb.git"
          git config --global url."https://github.com/bminor/newlib.git".insteadOf "https://sourceware.org/git/newlib-cygwin.git"

          # Larger buffer for big pack transfers over HTTP, and serialize submodule
          # fetches instead of bursting them in parallel (bursts are what tend to
          # trigger rate limiting in the first place).
          git config --global http.postBuffer 524288000
          git config --global submodule.fetchJobs 1

      - name: Clone riscv-gnu-toolchain (with retry)
        run: |
          for attempt in 1 2 3 4 5; do
            if git clone --recursive https://github.com/riscv/riscv-gnu-toolchain; then
              break
            fi
            echo "Clone/submodule fetch failed (attempt $attempt), backing off..."
            rm -rf riscv-gnu-toolchain
            sleep $((attempt * 20))
          done
          test -d riscv-gnu-toolchain

      - name: Build multilib RISC-V Toolchain
        run: |
          cd riscv-gnu-toolchain
          ./configure --prefix=/opt/riscv --enable-multilib --disable-linux
          df -h
          make -j "$(nproc)" || { echo "---- disk usage on failure ----"; df -h; exit 1; }

      - name: Sanity check
        run: |
          /opt/riscv/bin/riscv64-unknown-elf-gcc --version
          /opt/riscv/bin/riscv64-unknown-elf-gcc --print-multi-lib

      - name: Upload Toolchain
        uses: actions/upload-artifact@v4
        with:
          name: multilib-baremetal-toolchain
          path: /opt/riscv
