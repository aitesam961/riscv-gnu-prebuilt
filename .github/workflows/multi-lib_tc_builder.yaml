name: Build RISC-V MULTI- Toolchain

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

env:
  PREFIX: ${{ github.workspace }}/install
  ARCH: rv64gc_zicsr_zifencei
  ABI: lp64d

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:

      - name: Free up disk space (build needs ~20 GB)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/share/boost /usr/local/graalvm \
                       /usr/local/share/chromium /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autotools-dev curl python3 python3-pip \
            libmpc-dev libmpfr-dev libgmp-dev libusb-1.0-0-dev \
            gawk build-essential bison flex texinfo gperf libtool \
            patchutils bc zlib1g-dev libexpat1-dev libncurses-dev \
            device-tree-compiler

      - name: Clone sources + submodules (shallow, parallel)
        run: |
          # shallow top-level clone; add --branch <release-tag> to pin a version
          git clone --depth 1 https://github.com/riscv-collab/riscv-gnu-toolchain src
          cd src
          # --depth 1 : only the pinned commit of each submodule, no history
          # --jobs N  : fetch submodules in parallel
          # (if a pinned commit isn't a branch tip, git fetches that exact SHA
          #  directly — GitHub allows arbitrary-SHA fetches)
          git submodule update --init --recursive --depth 1 --jobs "$(nproc)"

      - name: Configure (single-config newlib toolchain)
        working-directory: src
        run: |
          ./configure --prefix="$PREFIX" \
            --with-arch="$ARCH" \
            --with-abi="$ABI"

      - name: Build (default make target = newlib)
        working-directory: src
        run: make -j"$(nproc)"    # drop to -j2 if the runner OOMs

      - name: Smoke test (verifies zicsr + zifencei assemble/link)
        run: |
          "$PREFIX/bin/riscv64-unknown-elf-gcc" --version
          printf 'int main(void) { asm volatile("csrr x0, misa"); asm volatile("fence.i"); return 0; }\n' > /tmp/smoke.c
          "$PREFIX/bin/riscv64-unknown-elf-gcc" -march="$ARCH" -mabi="$ABI" /tmp/smoke.c -o /tmp/smoke.elf
          ls -l /tmp/smoke.elf
          du -sh "$PREFIX"

      - name: Package (tar preserves exec permissions)
        run: tar -czf "riscv-newlib-${ARCH}.tar.gz" -C "$PREFIX" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: riscv-newlib-${{ env.ARCH }}
          path: riscv-newlib-*.tar.gz
          retention-days: 30
          compression-level: 0
          if-no-files-found: error