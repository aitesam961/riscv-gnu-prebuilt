name: Build CVA6 RISC-V Baremetal Toolchain

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout CVA6 fork
        uses: actions/checkout@v4
        with:
          repository: aitesam961/cva6
          ref: master

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autotools-dev curl wget git cmake ninja-build python3 python3-pip libmpc-dev libmpfr-dev libgmp-dev gawk build-essential bison flex texinfo gperf libtool patchutils bc zlib1g-dev libexpat-dev libglib2.0-dev device-tree-compiler help2man rsync unzip

      - name: Build CVA6 Toolchain
        run: |
          sudo ln -sf /bin/bash /bin/sh
          sudo mkdir -p /opt/riscv
          sudo chown -R $USER /opt/riscv
          cd util/toolchain-builder
          bash get-toolchain.sh gcc-13.1.0-baremetal
          bash build-toolchain.sh gcc-13.1.0-baremetal /opt/riscv

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cva6-gcc-13.1.0-baremetal
          path: /opt/riscv