name: CVA6 Toolchain Builder (GCC 13.1.0, -mtune=cva6)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"    # 1st of each month — delete these 2 lines if manual-only

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/share/boost /usr/local/graalvm \
                       /usr/local/share/chromium /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true

      - name: Install dependencies (toolchain-builder prerequisites)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autotools-dev curl git \
            libmpc-dev libmpfr-dev libgmp-dev gawk \
            build-essential bison flex texinfo gperf libtool \
            bc zlib1g-dev

      - name: Clone CVA6
        run: git clone --depth 1 https://github.com/openhwfoundation/cva6 cva6

      - name: Fetch toolchain sources
        working-directory: cva6/util/toolchain-builder
        run: bash get-toolchain.sh

      - name: Apply CVA6 tuning patch (adds -mtune=cva6)
        working-directory: cva6/util/toolchain-builder/src/gcc
        run: git apply ../../gcc-cva6-tune.patch

      - name: Build toolchain (default config: gcc-13.1.0-baremetal)
        working-directory: cva6/util/toolchain-builder
        run: bash build-toolchain.sh "$HOME/riscv"

      - name: Sanity check (verifies the -mtune=cva6 patch took)
        run: |
          $HOME/riscv/bin/riscv-none-elf-gcc --version
          printf 'int main(void){return 0;}\n' > /tmp/t.c
          $HOME/riscv/bin/riscv-none-elf-gcc -mtune=cva6 -S /tmp/t.c -o /tmp/t.s

      # Optional: alias old-style triple names if some script needs them
      # - name: Add riscv64-unknown-elf-* symlinks
      #   run: |
      #     cd "$HOME/riscv/bin"
      #     for t in riscv-none-elf-*; do
      #       ln -sv "$t" "riscv64-unknown-elf-${t#riscv-none-elf-}"
      #     done

      - name: Package
        run: tar -czf cva6-toolchain.tar.gz -C "$HOME/riscv" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cva6-toolchain-${{ github.run_number }}
          path: cva6-toolchain.tar.gz
          retention-days: 40
          compression-level: 0
          if-no-files-found: error