name: Ibex Toolchain (rv32imc newlib)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"    # 1st of each month — delete these 2 lines if manual-only

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/share/boost /usr/local/graalvm \
                       /usr/local/share/chromium /usr/local/share/powershell \
                       /usr/lib/jvm /opt/hostedtoolcache
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake autotools-dev curl python3 python3-pip git \
            libmpc-dev libmpfr-dev libgmp-dev libusb-1.0-0-dev \
            gawk build-essential bison flex texinfo gperf libtool \
            patchutils bc zlib1g-dev libexpat1-dev libncurses-dev

      - name: Clone sources (shallow, parallel submodules)
        run: |
          git clone --depth 1 https://github.com/riscv-collab/riscv-gnu-toolchain src
          cd src
          git submodule update --init --recursive --depth 1 --jobs "$(nproc)"

      - name: Configure (Ibex: rv32imc, soft-float)
        working-directory: src
        run: |
          # If your Ibex has bitmanip enabled, append _zba_zbb_zbs to --with-arch
          ./configure --prefix="$HOME/riscv" \
            --with-arch=rv32imc_zicsr_zifencei \
            --with-abi=ilp32

      - name: Build
        working-directory: src
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log    # drop to -j2 if the runner OOMs

      - name: Diagnose (only if the build failed)
        if: failure()
        working-directory: src
        run: |
          echo "### Disk state:"
          df -h /
          df -i /
          echo "### OOM killer activity:"
          sudo dmesg | grep -i "out of memory" | tail -n 10 || true
          echo "### Error lines from build.log:"
          grep -nE '\*\*\*|No space|Killed|memory|rror' build.log | tail -n 40 || true

      - name: Smoke test (verifies zicsr + zifencei assemble/link)
        run: |
          $HOME/riscv/bin/riscv64-unknown-elf-gcc --version
          printf 'int main(void){ asm volatile("csrr x0, misa"); asm volatile("fence.i"); return 0; }\n' > smoke.c
          $HOME/riscv/bin/riscv64-unknown-elf-gcc -march=rv32imc_zicsr_zifencei -mabi=ilp32 smoke.c -o smoke.elf
          ls -l smoke.elf

      - name: Add riscv32-unknown-elf-* aliases (Ibex scripts expect this prefix)
        run: |
          cd "$HOME/riscv/bin"
          for t in riscv64-unknown-elf-*; do
            ln -svf "$t" "riscv32-unknown-elf-${t#riscv64-unknown-elf-}"
          done

      - name: Package (tar preserves exec permissions and symlinks)
        run: tar -czf ibex-toolchain-rv32imc.tar.gz -C "$HOME/riscv" .

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ibex-toolchain-rv32imc-${{ github.run_number }}
          path: ibex-toolchain-rv32imc.tar.gz
          retention-days: 40
          compression-level: 0
          if-no-files-found: error